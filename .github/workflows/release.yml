name: Check and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 20
    steps:
      - name: Install test dependencies
        run: pacman -Syu --noconfirm --needed git python fontconfig kconfig desktop-file-utils sudo shellcheck
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check as an unprivileged user
        run: |
          useradd --create-home --shell /bin/bash tester
          runuser -u tester -- bash scripts/check.sh

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Build and publish from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published; skipping."
            exit 0
          fi
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            [[ $(git rev-parse "$tag^{commit}") == "$GITHUB_SHA" ]] || { echo 'Tag points to another commit'; exit 1; }
          fi
          bash scripts/package.sh "$RUNNER_TEMP/release" "$GITHUB_SHA"
          gh release create "$tag" \
            "$RUNNER_TEMP/release/cachyos-setup-$version.tar.gz" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file "docs/releases/$tag.md" --latest
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
